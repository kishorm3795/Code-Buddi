services:
  # MongoDB Database
  mongo:
    image: mongo:6
    container_name: codebuddi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=codebuddi
    networks:
      codebuddi-net:
        aliases:
          - mongodb
          - mongo
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1 || mongo --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis In-Memory Store
  redis:
    image: redis:7-alpine
    container_name: codebuddi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - codebuddi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend - Login Service (Node 22 slim)
  login:
    build:
      context: ./Backend/Login
      dockerfile: Dockerfile
    container_name: codebuddi-login
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - path: ./Backend/Login/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/codebuddi
      - NODE_ENV=production
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - codebuddi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Backend - Genai Service (Python 3.12 slim + gunicorn)
  genai:
    build:
      context: ./Backend/Genai
      dockerfile: Dockerfile
    container_name: codebuddi-genai
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - path: ./Backend/Genai/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      login:
        condition: service_healthy
    networks:
      - codebuddi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Backend - TempFile Service (Python 3.12 slim + gunicorn)
  tempfile:
    build:
      context: ./Backend/TempFile
      dockerfile: Dockerfile
    container_name: codebuddi-tempfile
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - path: ./Backend/TempFile/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=5002
      - TEMP_FILE_URL=http://localhost:5002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - FLASK_ENV=production
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codebuddi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend & Reverse Proxy (Vite build + Nginx static server & gateway)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: codebuddi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - path: ./Frontend/.env
        required: false
      - path: .env
        required: false
    environment:
      - VITE_API_GATEWAY_URL=
    depends_on:
      login:
        condition: service_healthy
      genai:
        condition: service_healthy
      tempfile:
        condition: service_healthy
    networks:
      - codebuddi-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  codebuddi-net:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
