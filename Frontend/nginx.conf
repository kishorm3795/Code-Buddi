# Production Nginx Gateway & Static Asset Server for Code-Buddi
server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gateway Health Check
    location /healthz {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 1. Login Service (/api/*) -> http://login:5003/api/*
    location /api/ {
        proxy_pass http://login:5003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. GenAI Service (/ai/*) -> http://genai:5001/*
    location /ai/ {
        proxy_pass http://genai:5001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; # Required for SSE streaming text generation
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. TempFile Service (/share/*) -> http://tempfile:5002/*
    location /share/ {
        proxy_pass http://tempfile:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Frontend SPA with fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
