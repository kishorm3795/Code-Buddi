name: CI - Lint & Test All Packages

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test-login:
    name: Backend - Login (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Login
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Backend/Login/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run unit & integration tests
        run: npm test

  test-genai:
    name: Backend - Genai (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Genai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/Genai/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest test suite
        run: pytest tests

  test-tempfile:
    name: Backend - TempFile (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/TempFile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/TempFile/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: pytest tests

  test-frontend:
    name: Frontend - Vite & React (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit & component tests
        run: npm test -- --run

      - name: Verify production Vite build
        run: npm run build
